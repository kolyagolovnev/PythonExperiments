services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: vkazarme
      POSTGRES_PASSWORD: vkazarme
      POSTGRES_DB: vkazarme
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vkazarme"]
      interval: 2s
      timeout: 2s
      retries: 15
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: .
    ports:
      - "9999:9999"
    environment:
      SECRET: ${SECRET:-change_this_to_a_strong_random_secret}
      ACCESS_TOKEN_TTL_SECONDS: ${ACCESS_TOKEN_TTL_SECONDS:-3600}
      PASSWORD_HASH_ROUNDS: ${PASSWORD_HASH_ROUNDS:-12}
      MEDIA_MAX_BYTES: ${MEDIA_MAX_BYTES:-5000000}
      DATABASE_URL: postgresql+asyncpg://vkazarme:vkazarme@db:5432/vkazarme
      SEED_ENABLED: ${SEED_ENABLED:-true}
      ACCOUNT_EXAMPLES_DIR: ${ACCOUNT_EXAMPLES_DIR:-account_examples}
      GROUP_EXAMPLES_DIR: ${GROUP_EXAMPLES_DIR:-group_examples}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./admins.json:/srv/app/admins.json:ro
      - ./account_examples:/srv/app/account_examples:ro
      - ./group_examples:/srv/app/group_examples:ro

volumes:
  pgdata:
