server {
    listen 443 ssl;
    # server_name oauth.vk.com;
    server_name id.vk.ru
    #/oauth2/auth для запроса с кодом подтвреждения, client_id и тд для получения токена
    #/oauth2/user_info для запроса инфы с использованием access_token + client_id
    ssl_certificate /etc/nginx/certs/vk_mock.crt;
    ssl_certificate_key /etc/nginx/certs/vk_mock.key;

    location / {
        # TODO: Надо бы взять название сети из docker_compose_tests.yml
        proxy_pass http://vk-oauth2:10013; 
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

server {
    listen 443 ssl;
    server_name oauth2.googleapis.com
    #/token - для получения access_token
    ssl_certificate /etc/nginx/certs/google_mock.crt;
    ssl_certificate_key /etc/nginx/certs/google_mock.key;

    location / {
        # TODO: Надо бы взять название сети из docker_compose_tests.yml
        proxy_pass http://google-oauth2:10013; 
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}